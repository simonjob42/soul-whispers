<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1e3a5f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="心语" />
  <title>心语 · Soul-Whispers</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
  <script src="verses.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="ambient-glow" aria-hidden="true"></div>

  <div class="page-wrapper">
    <!-- 右上角工具栏 -->
    <div class="top-utility-bar">
      <button type="button" id="btn-install-app" class="theme-toggle-btn install-app-btn hidden" title="安装到手机桌面">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v12"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <path d="M5 21h14"></path>
        </svg>
        <span id="install-app-label">安装 App</span>
      </button>
      <button type="button" id="btn-lang-toggle" class="theme-toggle-btn" title="Switch Language / 切换中英文">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        <span id="lang-toggle-label">EN</span>
      </button>
      <button type="button" id="btn-theme-toggle" class="theme-toggle-btn" aria-pressed="false" title="切换夜间护眼模式">
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <span id="theme-toggle-label">夜间模式</span>
      </button>
    </div>

    <!-- 顶部标题区 -->
    <header class="site-header">
      <div class="header-badge">SOUL-WHISPERS · 心语</div>
      <h1 class="site-title">心语</h1>
      <p class="site-subtitle">
        <span id="today-date"></span> · 在日常微光中记录恩典、思索与小确幸
      </p>
      <div class="mobile-install-bar" aria-label="手机端安装入口">
        <button type="button" id="btn-ios-install" class="install-platform-btn">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M16.365 1.43c0 1.14-.493 2.27-1.177 3.08-.744.9-1.99 1.57-2.987 1.57-.12 0-.23-.02-.3-.03-.01-.06-.04-.22-.04-.39 0-1.15.572-2.27 1.206-2.98.804-.94 2.142-1.64 3.248-1.68.03.13.05.28.05.43zm4.565 15.71c-.03.07-.463 1.58-1.518 3.12-.945 1.34-1.94 2.71-3.43 2.71-1.517 0-1.9-.88-3.63-.88-1.698 0-2.302.91-3.67.91-1.377 0-2.332-1.26-3.428-2.8-1.287-1.82-2.323-4.63-2.323-7.28 0-4.28 2.797-6.55 5.552-6.55 1.448 0 2.675.95 3.6.95.865 0 2.222-1.01 3.902-1.01.613 0 2.886.06 4.374 2.19-.13.09-2.383 1.37-2.383 4.19 0 3.26 2.854 4.42 2.955 4.45z"/>
          </svg>
          <span id="ios-install-label">iPhone 下载</span>
        </button>
        <button type="button" id="btn-android-install" class="install-platform-btn">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M17.6 9.48l1.84-3.18c.16-.31.04-.69-.26-.85-.29-.15-.65-.06-.83.22l-1.88 3.24a11.43 11.43 0 0 0-8.94 0L5.65 5.67c-.19-.28-.54-.37-.83-.22-.3.16-.42.54-.26.85l1.84 3.18C4.08 10.77 2.5 13.15 2.5 16h19c0-2.85-1.58-5.23-3.9-6.52zM7 13.75a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5zm10 0a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5z"/>
          </svg>
          <span id="android-install-label">Android 下载</span>
        </button>
      </div>
    </header>

    <!-- 每日和合本圣经感恩经节区 -->
    <section class="daily-verse-card" aria-label="每日圣经感恩经节">
      <div class="verse-corner-ornament" aria-hidden="true"></div>
      <div class="verse-header">
        <span class="verse-tag">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          今日和合本感恩经节
        </span>
        <div class="verse-actions">
          <button type="button" id="btn-next-verse" class="btn-ghost" title="切换另一节经文">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            换一节
          </button>
          <button type="button" id="btn-collect-verse" class="btn-ghost" title="将今日经节贴到便签墙">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14"></path>
            </svg>
            收入便签
          </button>
        </div>
      </div>

      <blockquote class="verse-body">
        <span class="quote-mark" aria-hidden="true">“</span>
        <p id="verse-text" class="verse-text"></p>
      </blockquote>
      <footer class="verse-footer">
        <span class="gold-divider" aria-hidden="true"></span>
        <cite id="verse-ref" class="verse-ref"></cite>
      </footer>
    </section>

    <!-- 顶部便签输入与分类发布区 -->
    <section class="composer-card" aria-label="写下新便签">
      <div class="composer-top">
        <span class="composer-label">选择便签分类</span>
        <div class="category-pills" role="radiogroup" aria-label="便签分类">
          <button type="button" class="pill active" data-category="感恩恩典" role="radio" aria-checked="true">
            <span class="dot dot-grace"></span>感恩恩典
          </button>
          <button type="button" class="pill" data-category="读书金句" role="radio" aria-checked="false">
            <span class="dot dot-quote"></span>读书金句
          </button>
          <button type="button" class="pill" data-category="生活小确幸" role="radio" aria-checked="false">
            <span class="dot dot-joy"></span>生活小确幸
          </button>
        </div>
      </div>

      <div class="composer-input-wrap">
        <textarea
          id="note-input"
          class="note-textarea"
          rows="3"
          maxlength="600"
          placeholder="写下今天值得感恩的一件事、打动你的书摘，或一个温暖的瞬间……"
        ></textarea>
      </div>

      <div class="composer-bottom">
        <span class="composer-hint">提示：按 <kbd>Ctrl</kbd> / <kbd>⌘</kbd> + <kbd>Enter</kbd> 快速贴上便签</span>
        <button type="button" id="btn-add-note" class="btn-primary">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
          贴上便签
        </button>
      </div>
    </section>

    <!-- 便签墙展示区 -->
    <main class="board-section">
      <div class="board-header">
        <div class="board-title-row">
          <h2 class="board-title">灵感便签墙</h2>
          <span id="notes-count" class="notes-count">0 张便签</span>
        </div>
        <div class="filter-bar" role="tablist" aria-label="按分类筛选便签">
          <button type="button" class="filter-tab active" data-filter="全部" role="tab" aria-selected="true">全部</button>
          <button type="button" class="filter-tab" data-filter="感恩恩典" role="tab" aria-selected="false">感恩恩典</button>
          <button type="button" class="filter-tab" data-filter="读书金句" role="tab" aria-selected="false">读书金句</button>
          <button type="button" class="filter-tab" data-filter="生活小确幸" role="tab" aria-selected="false">生活小确幸</button>
        </div>
      </div>

      <div id="notes-grid" class="notes-masonry" aria-live="polite"></div>

      <div id="empty-state" class="empty-state hidden">
        <p id="empty-title" class="empty-title">便签墙暂时空着</p>
        <p id="empty-desc" class="empty-desc">在上方写下第一句感恩或灵感，贴上属于今天的记忆吧。</p>
      </div>
    </main>

    <footer class="site-footer">
      <p>所有便签仅保存在当前浏览器本地 · 愿你今日平安喜乐</p>
    </footer>
  </div>

  <!-- 手机安装指引弹窗 -->
  <div id="install-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title" class="modal-title">安装到手机桌面</h3>
        <button type="button" id="btn-close-modal" class="modal-close-btn" aria-label="关闭">×</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-footer">
        <button type="button" id="btn-copy-url" class="btn-ghost">复制当前网址</button>
        <button type="button" id="btn-modal-ok" class="btn-primary">我知道了</button>
      </div>
    </div>
  </div>

  <!-- 轻量提示条 -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- 导出图片专用的离屏渲染容器 -->
  <div id="export-stage" class="export-stage" aria-hidden="true"></div>
</body>
</html>
